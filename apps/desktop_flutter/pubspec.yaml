name: keeppass_nexus
description: A privacy-first KeePass-compatible password manager.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  flutter_rust_bridge: 2.13.0
  shared_preferences: ^2.3.2
  keeppass_nexus_rust:
    path: rust_builder
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
